name: Build bootable ISO and HDD images

on:
  push:
    branches: [master, main, arena/3cf9175c-zonix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            grub-common grub-pc-bin xorriso mtools dosfstools zip

      - name: Prepare ISO content with GRUB config
        run: |
          mkdir -p iso-content/boot/grub
          cp -a README.md CMakeLists.txt COPYING.DOC iso-content/ 2>/dev/null || true
          cat > iso-content/boot/grub/grub.cfg <<'GRUBEOF'
set timeout=5
set default=0

menuentry ZonixLiveISO {
  echo "Zonix ISO - KDE Plasma sources"
  echo "Not a bootable operating system"
}

menuentry Reboot {
  reboot
}
GRUBEOF

      - name: Build bootable ISO with grub-mkrescue
        run: grub-mkrescue -o zonix.iso iso-content/ || true

      - name: Create raw HDD image with boot sector
        run: |
          # Create 100MB raw image
          dd if=/dev/zero of=zonix-hdd.img bs=1M count=100

          # Create MBR partition table with one FAT12 partition
          parted zonix-hdd.img --script -- mklabel msdos
          parted zonix-hdd.img --script -- mkpart primary fat12 1MiB 100MiB
          parted zonix-hdd.img --script -- set 1 boot on

          # Format partition with FAT12
          LOOP=$(sudo losetup -fP zonix-hdd.img --show)
          sudo mkfs.vfat ${LOOP}p1

          # Install GRUB boot sector
          sudo mkdir -p /mnt/zonix-hdd
          sudo mount ${LOOP}p1 /mnt/zonix-hdd
          sudo grub-install --target=i386-pc --boot-directory=/mnt/zonix-hdd/boot --root-directory=/mnt/zonix-hdd $LOOP

          # Copy grub.cfg to HDD
          sudo mkdir -p /mnt/zonix-hdd/boot/grub
          sudo cp iso-content/boot/grub/grub.cfg /mnt/zonix-hdd/boot/grub/

          sudo umount /mnt/zonix-hdd
          sudo losetup -d $LOOP

      - name: Verify outputs
        run: |
          test -f zonix.iso || { echo "ERROR: zonix.iso missing" >&2; exit 1; }
          test -f zonix-hdd.img || { echo "ERROR: zonix-hdd.img missing" >&2; exit 1; }
          echo "ISO size: $(stat -c%s zonix.iso) bytes"
          echo "HDD size: $(stat -c%s zonix-hdd.img) bytes"
          file zonix.iso zonix-hdd.img

      - name: Package images into zip
        run: zip -r zonix-release.zip zonix.iso zonix-hdd.img

      - uses: actions/upload-artifact@v4
        with:
          name: zonix-images
          path: zonix-release.zip
          retention-days: 30
