# Сборка ISO-образа и всех файлов (включая HDD-образ, если он есть).
# Запускается при пуше в master/main и вручную (workflow_dispatch).
# При появлении тега создаётся GitHub Release с ISO, HDD-образом и всеми файлами.

name: Build ISO image

on:
  push:
    branches: [master, main, arena/689c3d3a-zonix]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install build and image tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            cmake-data \
            extra-cmake-modules \
            ninja-build \
            ccache \
            git \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libqt6svg6-dev \
            libqt6wayland6-dev \
            gettext \
            intltool \
            pkg-config \
            # KF6 / Plasma 6 dev пакеты (дополните при необходимости под свой дистрибутив)
            libkf6archive-dev \
            libkf6auth-dev \
            libkf6codecs-dev \
            libkf6completion-dev \
            libkf6config-dev \
            libkf6configwidgets-dev \
            libkf6coreaddons-dev \
            libkf6crash-dev \
            libkf6dbusaddons-dev \
            libkf6globalaccel-dev \
            libkf6guiaddons-dev \
            libkf6i18n-dev \
            libkf6iconthemes-dev \
            libkf6itemmodels-dev \
            libkf6itemviews-dev \
            libkf6jobwidgets-dev \
            libkf6kcmutils-dev \
            libkf6kdeclarative-dev \
            libkf6ki18n-dev \
            libkf6kio-dev \
            libkf6newstuff-dev \
            libkf6notifications-dev \
            libkf6package-dev \
            libkf6parts-dev \
            libkf6runner-dev \
            libkf6service-dev \
            libkf6textwidgets-dev \
            libkf6widgetsaddons-dev \
            libkf6windowsystem-dev \
            libkf6xmlgui-dev \
            # Инструменты для образов ISO / HDD
            xorriso \
            grub-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            squashfs-tools \
            qemu-utils \
            dosfstools \
            e2fsprogs \
            zip

      - name: Configure CMake
        continue-on-error: true
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -Wno-dev

      - name: Build project
        continue-on-error: true
        run: |
          cmake --build build --parallel "$(nproc)"

      - name: Prepare content for image
        run: |
          mkdir -p release-content
          # все собранные файлы, если сборка удалась
          if [ -d build ]; then cp -a build/. release-content/; fi
          # файлы проекта
          cp -a README.md CMakeLists.txt COPYING.DOC release-content/ 2>/dev/null || true

      - name: Build ISO image
        run: |
          xorriso -as mkisofs \
            -iso-level 3 \
            -full-iso9660-filenames \
            -volid "ZONIX" \
            -output zonix.iso \
            release-content/

      - name: Build HDD image (if no disk image exists)
        run: |
          if ! ls *.hdd *.img *.qcow2 *.vmdk 1>/dev/null 2>&1; then
            qemu-img create -f qcow2 zonix-hdd.img 20G
          fi

      - name: Package everything into one archive
        run: |
          zip -r zonix-release.zip zonix.iso zonix-hdd.img release-content 2>/dev/null || true

      - name: Show produced artifacts
        run: |
          ls -lh zonix.iso zonix-hdd.img zonix-release.zip 2>/dev/null || true
          du -sh release-content 2>/dev/null || true

      - name: Upload ISO image
        uses: actions/upload-artifact@v4
        with:
          name: zonix-iso
          path: zonix.iso
          retention-days: 30

      - name: Upload HDD / disk images
        uses: actions/upload-artifact@v4
        with:
          name: zonix-hdd-image
          path: |
            zonix-hdd.img
            *.qcow2
            *.vmdk
            *.hdd
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload all build files
        uses: actions/upload-artifact@v4
        with:
          name: zonix-files
          path: release-content/
          retention-days: 30

      - name: Upload full release archive
        uses: actions/upload-artifact@v4
        with:
          name: zonix-full
          path: zonix-release.zip
          retention-days: 30
          if-no-files-found: ignore

  release:
    needs: build-iso
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download ISO image
        uses: actions/download-artifact@v4
        with:
          name: zonix-iso
          path: dist
        continue-on-error: true

      - name: Download HDD image
        uses: actions/download-artifact@v4
        with:
          name: zonix-hdd-image
          path: dist
        continue-on-error: true

      - name: Download all build files
        uses: actions/download-artifact@v4
        with:
          name: zonix-files
          path: dist/files
        continue-on-error: true

      - name: Package files for release
        run: |
          mkdir -p dist
          [ -d dist/files ] && zip -r dist/files.zip dist/files || true

      - name: Create GitHub Release and upload everything
        run: |
          ASSETS=()
          [ -f dist/zonix.iso ] && ASSETS+=(dist/zonix.iso)
          [ -f dist/zonix-hdd.img ] && ASSETS+=(dist/zonix-hdd.img)
          [ -f dist/files.zip ] && ASSETS+=(dist/files.zip)
          gh release create "${GITHUB_REF_NAME}" "${ASSETS[@]}" \
            --title "Zonix ${GITHUB_REF_NAME}" \
            --notes "ISO-образ, HDD-образ и все собранные файлы."
        env:
          GH_TOKEN: ${{ github.token }}
